name: Weekly events agent

on:
  schedule:
    - cron: "0 14 * * 1"   # every Monday 14:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agent/requirements.txt
      - name: Find events with You.com
        env:
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
        run: python agent/fetch_events.py
      - name: Commit updated data
        run: |
          git config user.name "globaltech-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet || git commit -m "chore(data): weekly events refresh $(date -u +%F)"
          git push
