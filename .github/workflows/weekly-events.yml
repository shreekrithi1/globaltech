name: Weekly events agent

# The weekly refresh now runs inside Vercel (agent/vercel-build.sh + Vercel Cron), where YOU_COM_API is set.
# This workflow is kept as a manual fallback: Actions → Weekly events agent → Run workflow.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r agent/requirements.txt
      - name: Find, merge and de-duplicate events
        env:
          YOU_COM_API: ${{ secrets.YOU_COM_API }}
        run: python agent/run.py
      - name: Commit updated data
        run: |
          git config user.name "techevents-agent"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/events.json public/data/agent-report.json agent/geocache.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(data): weekly events refresh $(date -u +%F)"
          git pull --rebase origin main
          git push
